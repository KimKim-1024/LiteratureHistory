<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古典文学史 小テスト完全制覇クイズ</title>
<style>
  :root {
    --primary: #3b82f6;
    --primary-dark: #1d4ed8;
    --success: #10b981;
    --danger: #ef4444;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --text-sub: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 16px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    padding: 24px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 16px;
  }
  h1 { font-size: 1.6rem; color: #0f172a; margin-bottom: 8px; }
  .badge {
    display: inline-block;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 9999px;
  }
  /* メニュー画面 */
  .range-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .range-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
  }
  .range-btn:hover {
    border-color: var(--primary);
    background: #eff6ff;
    transform: translateY(-2px);
  }
  .range-btn span { display: block; font-size: 0.8rem; color: var(--text-sub); font-weight: normal; margin-top: 4px; }
  .settings {
    background: #f1f5f9;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 0.9rem;
  }
  /* クイズ画面 */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    color: var(--text-sub);
    font-size: 0.9rem;
  }
  .progress-bar-wrap {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }
  .question-box {
    margin-bottom: 24px;
  }
  .q-number {
    font-weight: bold;
    color: var(--primary-dark);
    font-size: 1rem;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .option-btn {
    background: #ffffff;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 1rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
  }
  .option-btn:hover:not(:disabled) {
    border-color: #94a3b8;
    background: #f8fafc;
  }
  .option-btn.correct {
    background: #dcfce7 !important;
    border-color: var(--success) !important;
    color: #166534;
    font-weight: bold;
  }
  .option-btn.wrong {
    background: #fee2e2 !important;
    border-color: var(--danger) !important;
    color: #991b1b;
  }
  .feedback-box {
    display: none;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    animation: fadeIn 0.2s ease-in-out;
  }
  .feedback-box.correct { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .feedback-box.wrong { background: #fef2f2; border: 1px solid #fecaca; }
  .fb-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 6px; }
  .fb-desc { font-size: 0.95rem; color: #334155; }
  .nav-btn-wrap { display: flex; justify-content: flex-end; }
  .action-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .action-btn:hover { background: var(--primary-dark); }
  /* 結果画面 */
  .result-box { text-align: center; padding: 20px 0; }
  .score-num { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
  .result-btns { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .sec-btn { background: #64748b; }
  .sec-btn:hover { background: #475569; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>古典文学史 小テスト完全制覇クイズ</h1>
    <span class="badge">学校小テスト・入試頻出問題 完全準拠</span>
  </header>

  <!-- メニュー画面 -->
  <div id="screen-menu">
    <div class="settings">
      <label><input type="checkbox" id="chk-shuffle" checked> 出題順をシャッフルする</label>
    </div>
    <div class="range-grid">
      <button class="range-btn" onclick="startQuiz('①【上代・中古】', 1, 59)">①【上代・中古】<span>問題 1 〜 59</span></button>
      <button class="range-btn" onclick="startQuiz('②【中古】', 60, 116)">②【中古】<span>問題 60 〜 116</span></button>
      <button class="range-btn" onclick="startQuiz('③【中古】', 117, 175)">③【中古】<span>問題 117 〜 175</span></button>
      <button class="range-btn" onclick="startQuiz('④【中世】', 176, 241)">④【中世】<span>問題 176 〜 241</span></button>
      <button class="range-btn" onclick="startQuiz('⑤【中世】', 242, 307)">⑤【中世】<span>問題 242 〜 307</span></button>
      <button class="range-btn" onclick="startQuiz('⑥【近世】', 308, 360)">⑥【近世】<span>問題 308 〜 360</span></button>
      <button class="range-btn" onclick="startQuiz('⑦【近世】', 361, 406)">⑦【近世】<span>問題 361 〜 406</span></button>
    </div>
  </div>

  <!-- クイズ画面 -->
  <div id="screen-quiz" style="display:none;">
    <div class="quiz-header">
      <span id="quiz-title"></span>
      <span id="quiz-counter"></span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="prog-bar"></div>
    </div>
    <div class="question-box">
      <div class="q-number" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
    </div>
    <div class="options-grid" id="options-container"></div>
    <div class="feedback-box" id="feedback">
      <div class="fb-title" id="fb-title"></div>
      <div class="fb-desc" id="fb-desc"></div>
    </div>
    <div class="nav-btn-wrap">
      <button class="action-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">次の問題へ</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" style="display:none;">
    <div class="result-box">
      <h2>学習完了！</h2>
      <div class="score-num" id="score-display">0 / 0</div>
      <p id="score-message"></p>
      <div class="result-btns">
        <button class="action-btn" onclick="retryQuiz()">もう一度解く</button>
        <button class="action-btn sec-btn" id="btn-review" style="display:none;" onclick="reviewMistakes()">間違えた問題だけ解く</button>
        <button class="action-btn sec-btn" onclick="backToMenu()">範囲選択に戻る</button>
      </div>
    </div>
  </div>
</div>

<script>
// 全問題マスターデータ（PDF1ページ目記載の出題範囲①〜⑦に完全準拠）
const masterData = [
  // ========== ①【上代・中古】 1〜59 ==========
  { id:1, q:'『古事記』の編者名を二人答えよ。', ans:'稗田阿礼・太安万侶', opts:['稗田阿礼・太安万侶','舎人親王・太安万侶','菅原道真・紀貫之','稗田阿礼・舎人親王'], tip:'天武天皇の命により稗田阿礼が誦習し、元明天皇の命で太安万侶が筆録（712年）。' },
  { id:2, q:'『古事記』は記載文学と呼ばれるが、これ以前の語り伝えによる文字を用いない文学を何というか。', ans:'口承文学（口誦文学）', opts:['口承文学（口誦文学）','記載文学','伝承散文','訓読文学'], tip:'文字を持たなかった時代、語り継がれ歌い継がれた文学。' },
  { id:3, q:'『古事記』や『大鏡』のような、事件・人物中心の叙述の仕方を何と呼ぶか。', ans:'紀伝体', opts:['紀伝体','編年体','日記体','年代記'], tip:'人物や伝記を中心に叙述する歴史の叙述形式。司馬遷の『史記』が祖。' },
  { id:4, q:'『古事記』が成立した翌年、元明天皇の命によって、諸国が編集して作った地誌は何か。漢字三字で答えよ。', ans:'風土記', opts:['風土記','日本紀','常陸国','古今集'], tip:'713年（和銅6年）に詔が出された地方の地誌・産物・伝説の記録。' },
  { id:5, q:'藤原浜成が著した現存最古の歌論書は何か。', ans:'歌経標式', opts:['歌経標式','古来風体抄','俊頼髄脳','毎月抄'], tip:'宝亀3年（772年）成立とされる漢文体の日本最古の歌論書。' },
  { id:6, q:'中国の模倣詩が多いが、我が国最初の漢詩集は何か。', ans:'懐風藻', opts:['懐風藻','凌雲集','文華秀麗集','経国集'], tip:'751年成立の日本現存最古の漢詩集。淡海三船等の編纂説がある。' },
  { id:7, q:'『万葉集』の中で、九州警護を任ぜられた東国の人々の詠んだ歌を特に何というか。', ans:'防人歌', opts:['防人歌','東歌','挽歌','相聞歌'], tip:'『万葉集』巻20などに収められた、東国から徴兵された兵士とその家族の歌。' },
  { id:8, q:'「阿米都知」「奈都可之」のような表記を一般に何と呼ぶか。', ans:'万葉仮名', opts:['万葉仮名','平仮名','片仮名','宣命書'], tip:'漢字の音や訓を借りて日本語の音を表記した古代の仮名。' },
  { id:9, q:'『万葉集』編纂の代表者の姓名と成立の時期の組み合わせとして正しいものはどれか。', ans:'大伴家持・八世紀', opts:['大伴家持・八世紀','柿本人麻呂・七世紀','山上憶良・八世紀','大伴旅人・九世紀'], tip:'万葉集は8世紀後半（759年以後）に大伴家持を中心として編纂。' },
  { id:10, q:'次の中から万葉歌人を一人選べ。\nア 山部赤人 イ 大伴黒主 ウ 壬生忠岑 エ 小野篁', ans:'山部赤人', opts:['山部赤人','大伴黒主','壬生忠岑','小野篁'], tip:'山部赤人は奈良時代の代表的万葉歌人（自然歌人・歌聖）。' },
  { id:11, q:'柿本人麻呂と同様に、『万葉集』の歌人である人物を一人選べ。\nア 賀茂真淵 イ 与謝蕪村 ウ 上田秋成 エ 藤原定家 オ 山上憶良', ans:'山上憶良', opts:['山上憶良','賀茂真淵','与謝蕪村','上田秋成'], tip:'山上憶良は社会的な視点や家族愛を詠んだ万葉期の代表歌人。' },
  { id:12, q:'「記紀」の略称が表す内容として最も適当なものを選べ。', ans:'古事記・日本書紀', opts:['古事記・日本書紀','風土記・続日本紀','祝詞・宣命','日記・紀行'], tip:'『古事記』と『日本書紀』を総称して「記紀」と呼ぶ。' },
  { id:13, q:'『古事記』の選録を命じた人は誰か。', ans:'天武天皇', opts:['天武天皇','藤原定家','大伴家持','菅原道真'], tip:'天武天皇が帝紀・旧辞の誤りを正すため、稗田阿礼に命じて誦習させたのが発端。' },
  { id:14, q:'『古事記』(712年)と『日本書紀』(720年)の成立年代として正しいものを選べ。', ans:'八世紀前半', opts:['八世紀前半','七世紀後半','八世紀後半','九世紀前半'], tip:'古事記は712年、日本書紀は720年で、いずれも8世紀前半の成立。' },
  { id:15, q:'A『古事記』、B『日本書紀』の編纂に最も関係の深い人物の組み合わせを選べ。', ans:'A：太安万侶 ／ B：舎人親王', opts:['A：太安万侶 ／ B：舎人親王','A：舎人親王 ／ B：太安万侶','A：稗田阿礼 ／ B：菅原道真','A：聖徳太子 ／ B：藤原不比等'], tip:'古事記は太安万侶が筆録。日本書紀は舎人親王らが編纂。' },
  { id:16, q:'『万葉集』と最も関係の深い事項を二つ選べ。\nア 奈良時代 イ 平安時代 ウ 鎌倉時代 エ 説話集 オ 歴史物語 カ 神話 キ 在原業平 ク 大伴家持', ans:'奈良時代・大伴家持', opts:['奈良時代・大伴家持','平安時代・在原業平','鎌倉時代・源実朝','奈良時代・神話'], tip:'奈良時代を代表する歌集で、編纂の中心人物は大伴家持。' },
  { id:17, q:'次のうち『万葉集』の歌人でない人は誰か。一人選べ。\nア 柿本人麻呂 イ 額田王 ウ 山上憶良 エ 紀貫之 オ 大伴旅人', ans:'紀貫之', opts:['紀貫之','柿本人麻呂','額田王','山上憶良'], tip:'紀貫之は平安時代前期の歌人で、『古今和歌集』の撰者。' },
  { id:18, q:'『古事記』(712)とほぼ同じ頃に成立した古典として最も適したものを一つ選べ。', ans:'日本書紀', opts:['日本書紀','古今和歌集','万葉集','古事記伝'], tip:'日本書紀は720年成立で、古事記とほぼ同時期（六国史の第1）。' },
  { id:19, q:'『万葉集』の三大部立に当てはまるもの（恋を中心とした消息歌／死を悼む歌）の組み合わせはどれか。', ans:'相聞・挽歌', opts:['相聞・挽歌','雑歌・抒情','連歌・哀悼','四季・離別'], tip:'万葉集の三大部立は「雑歌（ぞうか）」「相聞（そうもん）」「挽歌（ばんか）」。' },
  { id:20, q:'万葉歌人でないものを、次から一人選べ。\nア 大伴黒主 イ 柿本人麻呂 ウ 額田王 エ 山部赤人 オ 大伴家持', ans:'大伴黒主', opts:['大伴黒主','柿本人麻呂','額田王','山部赤人'], tip:'大伴黒主は平安時代の「六歌仙」の一人。' },
  { id:21, q:'大伴旅人と同時代の歌人を次から一人選べ。\nア 小野小町 イ 紀友則 ウ 山上憶良 エ 大友黒主', ans:'山上憶良', opts:['山上憶良','小野小町','紀友則','大友黒主'], tip:'太宰府で大伴旅人（大宰帥）と山上憶良（筑前守）は筑紫歌壇を形成。' },

  { id:28, q:'次のうちから最も早く成立した作品を選べ。\nア 凌雲集 イ 懐風藻 ウ 経国集', ans:'懐風藻', opts:['懐風藻','凌雲集','経国集','文華秀麗集'], tip:'懐風藻は751年（奈良時代）。凌雲集(814)や経国集(827)は平安初期の勅撰漢詩集。' },

// アプリケーション状態管理
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongList = [];
let currentScopeName = '';
let currentStartId = 1;
let currentEndId = 406;

function startQuiz(scopeName, startId, endId) {
  currentScopeName = scopeName;
  currentStartId = startId;
  currentEndId = endId;

  const isShuffle = document.getElementById('chk-shuffle').checked;
  // 指定されたID範囲で抽出
  currentQuestions = masterData.filter(item => item.id >= startId && item.id <= endId);

  if (isShuffle) {
    shuffleArray(currentQuestions);
  }

  currentIndex = 0;
  score = 0;
  wrongList = [];

  document.getElementById('screen-menu').style.display = 'none';
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';

  renderQuestion();
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('quiz-title').textContent = `${currentScopeName}（問${currentStartId}〜${currentEndId}）`;
  document.getElementById('quiz-counter').textContent = `第 ${currentIndex + 1} 問 / 全 ${currentQuestions.length} 問`;
  document.getElementById('prog-bar').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

  document.getElementById('q-num').textContent = `問題 ${q.id}`;
  document.getElementById('q-text').textContent = q.q;

  const optContainer = document.getElementById('options-container');
  optContainer.innerHTML = '';

  // 選択肢のシャッフル
  const opts = [...q.opts];
  shuffleArray(opts);

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectOption(btn, opt, q);
    optContainer.appendChild(btn);
  });

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
}

function selectOption(selectedBtn, selectedText, q) {
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(btn => btn.disabled = true);

  const fbBox = document.getElementById('feedback');
  const fbTitle = document.getElementById('fb-title');
  const fbDesc = document.getElementById('fb-desc');

  const isCorrect = (selectedText === q.ans);

  if (isCorrect) {
    selectedBtn.classList.add('correct');
    fbBox.className = 'feedback-box correct';
    fbTitle.textContent = '◯ 正解！';
    score++;
  } else {
    selectedBtn.classList.add('wrong');
    fbBox.className = 'feedback-box wrong';
    fbTitle.textContent = '✕ 不正解…';
    wrongList.push(q);

    allBtns.forEach(btn => {
      if (btn.textContent === q.ans) {
        btn.classList.add('correct');
      }
    });
  }

  fbDesc.innerHTML = `<strong>正解：${q.ans}</strong><br>${q.tip}`;
  fbBox.style.display = 'block';
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  const total = currentQuestions.length;
  document.getElementById('score-display').textContent = `${score} / ${total}`;

  const rate = score / total;
  let msg = '';
  if (rate === 1.0) msg = '満点です！完璧に暗記できています。';
  else if (rate >= 0.8) msg = '合格圏内です！間違えた問題だけ解き直して万全にしましょう。';
  else if (rate >= 0.5) msg = 'あと一息！もう一度反復して確実に定着させましょう。';
  else msg = '基本事項を確認して、もう一度挑戦しましょう！';

  document.getElementById('score-message').textContent = msg;

  const btnReview = document.getElementById('btn-review');
  if (wrongList.length > 0) {
    btnReview.style.display = 'inline-block';
    btnReview.textContent = `間違えた問題（${wrongList.length}問）を復習`;
  } else {
    btnReview.style.display = 'none';
  }
}

function retryQuiz() {
  startQuiz(currentScopeName, currentStartId, currentEndId);
}

function reviewMistakes() {
  currentQuestions = [...wrongList];
  shuffleArray(currentQuestions);
  currentIndex = 0;
  score = 0;
  wrongList = [];

  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';

  renderQuestion();
}

function backToMenu() {
  document.getElementById('screen-menu').style.display = 'block';
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'none';
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
